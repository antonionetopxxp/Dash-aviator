<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin:0;
    background: radial-gradient(circle at top, #0a0f1c, #05070d);
    color:#fff;
    font-family: 'Segoe UI', sans-serif;
}

header {
    display:flex;
    justify-content:space-between;
    padding:15px 25px;
    background:#0f1629;
    border-bottom:1px solid rgba(255,255,255,0.1);
}

.logo {
    font-weight:bold;
    font-size:18px;
}

.live {
    color:#00ff88;
    animation: blink 1s infinite;
}

.container {
    padding:20px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.card {
    background:#121a33;
    padding:20px;
    border-radius:14px;
    box-shadow:0 0 20px rgba(0,255,150,0.08);
}

input, button {
    padding:10px;
    border:none;
    border-radius:8px;
}

button {
    background:#00ff88;
    font-weight:bold;
    cursor:pointer;
}

.alerta {
    font-size:18px;
    font-weight:bold;
}

.vip {
    background: linear-gradient(90deg, gold, orange);
    color:#000;
    padding:5px 10px;
    border-radius:6px;
    font-weight:bold;
}
</style>

</head>

<body>

<header>
<div class="logo">🚀 AVIATOR PRO</div>
<div class="live">● AO VIVO</div>
<div class="vip">VIP</div>
</header>
<p style="color:orange;">⚡ Apenas 23 vagas restantes hoje</p>
<div class="container">

<div class="card">
<h3>Inserir Resultado</h3>
<input id="entrada" placeholder="Ex: 1.45">
<button onclick="add()">Adicionar</button>
</div>

<div class="card">
<h3>Status</h3>
<p id="alerta" class="alerta">Aguardando dados...</p>
</div>

<div class="card">
<h3>Gráfico</h3>
<canvas id="grafico"></canvas>
</div>

<div class="card">
<h3>Estratégia</h3>
<p id="estrategia">Carregando...</p>
</div>
<p>+3.421 usuários ativos</p>
</div>
    <a href="https://wa.me/5561991057795">
<button>Suporte VIP</button>
</a>

<script>
let dados = [];

const ctx = document.getElementById('grafico');
const chart = new Chart(ctx, {
    type: 'line',
    data: { labels: [], datasets: [{ data: [], tension:0.4 }] }
});

function add(){
    let v = parseFloat(document.getElementById('entrada').value);
    if(!v) return;

    dados.push(v);

    chart.data.labels.push('');
    chart.data.datasets[0].data.push(v);

    if(dados.length > 30){
        dados.shift();
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
    }

    chart.update();
    analisar();
}

function analisar(){

    let ultimos = dados.slice(-5);

    let baixos = ultimos.filter(x => x < 1.5).length;
    let altos = ultimos.filter(x => x > 2).length;

    if(baixos >= 4){
        document.getElementById('alerta').innerText = "⚠️ RISCO ALTO";
        document.getElementById('estrategia').innerText = "Evitar entrada. Muitas quedas seguidas.";
    }
    else if(altos >= 3){
        document.getElementById('alerta').innerText = "🔥 MOMENTO INTERESSANTE";
        document.getElementById('estrategia').innerText = "Possível janela de recuperação.";
    }
    else{
        document.getElementById('alerta').innerText = "✔️ ESTÁVEL";
        document.getElementById('estrategia').innerText = "Operar com cautela.";
    }

}
</script>

</body>
</html>
