<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Aviator PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin:0;
    background: radial-gradient(circle at top, #0a0f1c, #05070d);
    color:#fff;
    font-family: Arial;
}

header {
    display:flex;
    justify-content:space-between;
    padding:15px 20px;
    background:#0f1629;
}

.live {
    color:#00ff88;
    animation: blink 1s infinite;
}

.container {
    padding:15px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.card {
    background:#121a33;
    padding:15px;
    border-radius:12px;
}

button {
    padding:10px;
    background:#00ff88;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.cta {
    width:100%;
    background:#ffcc00;
    font-weight:bold;
    margin-top:10px;
}

.alerta {
    font-size:18px;
    font-weight:bold;
}

</style>
</head>

<body>

<header>
<div>🚀 AVIATOR PRO</div>
<div class="live">● AO VIVO</div>
<div id="vagas">23 vagas</div>
</header>

<div class="container">

<div class="card">
<h3>Inserir Resultado</h3>
<input id="entrada" placeholder="Ex: 1.45">
<button onclick="addManual()">Adicionar</button>
</div>

<div class="card">
<h3>Status</h3>
<p id="alerta">Iniciando sistema...</p>
</div>

<div class="card">
<h3>Gráfico</h3>
<canvas id="grafico"></canvas>
</div>

<div class="card">
<h3>Estratégia</h3>
<p id="estrategia">Aguardando análise...</p>
</div>

<div class="card">
<h3>Histórico</h3>
<p id="historico"></p>
</div>

<div class="card">
<p>+3.421 usuários ativos</p>

<a href="https://wa.me/SEUNUMERO">
<button>Suporte VIP</button>
</a>

<button class="cta">💰 LIBERAR SINAIS PREMIUM</button>
</div>

</div>

<audio id="som" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

<script>
let dados = [];

const ctx = document.getElementById('grafico').getContext('2d');

const chart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: [],
        datasets: [{
            label: 'Multiplicadores',
            data: [],
            borderWidth: 2,
            tension: 0.4
        }]
    }
});

function addManual(){
    let v = parseFloat(document.getElementById('entrada').value);
    if(!v) return;
    inserir(v);
}

function inserir(valor){
    dados.push(valor);

    if(dados.length > 30){
        dados.shift();
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
    }

    chart.data.labels.push('');
    chart.data.datasets[0].data.push(valor);

    chart.update();

    atualizarHistorico();
    analisar();
}

function atualizarHistorico(){
    document.getElementById("historico").innerText = dados.join(", ");
}

function analisar(){

    let ultimos = dados.slice(-5);

    let baixos = ultimos.filter(x => x < 1.5).length;
    let altos = ultimos.filter(x => x > 2).length;

    let alerta = document.getElementById("alerta");
    let estrategia = document.getElementById("estrategia");

    if(baixos >= 4){
        alerta.innerHTML = "⚠️ RISCO ALTO";
        estrategia.innerHTML = "Evite entradas. Sequência ruim detectada.";
    }
    else if(altos >= 3){
        alerta.innerHTML = "🔥 POSSÍVEL ENTRADA";
        estrategia.innerHTML = "Momento interessante. Operar com cautela.";
        document.getElementById("som").play();
    }
    else{
        alerta.innerHTML = "✔️ ESTÁVEL";
        estrategia.innerHTML = "Mercado neutro.";
    }
}

// SIMULAÇÃO AUTOMÁTICA (efeito ao vivo)
setInterval(() => {

    let random = (Math.random() * 3 + 1).toFixed(2);
    inserir(parseFloat(random));

}, 3000);


// CONTADOR DE VAGAS
let vagas = 23;

setInterval(()=>{
    if(vagas > 3){
        vagas--;
    }
    document.getElementById("vagas").innerText = vagas + " vagas";
}, 10000);

</script>

</body>
</html>
