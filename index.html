<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Aviator PRO</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin:0;
    background:#0a0f1c;
    color:#fff;
    font-family:Arial;
}

header {
    background:#11182e;
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.live {
    color:#00ff88;
    animation: blink 1s infinite;
}

@keyframes blink {
    50% { opacity:0.4; }
}

.container {
    padding:20px;
}

.card {
    background:#121a33;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 0 10px rgba(0,255,150,0.2);
}

input, button {
    padding:10px;
    border:none;
    border-radius:6px;
}

button {
    background:#00ff88;
    cursor:pointer;
    font-weight:bold;
}

.alerta {
    color:#ff4d4d;
    font-size:18px;
    font-weight:bold;
}

.safe {
    color:#00ff88;
}
</style>
</head>

<body>

<header>
🚀 AVIATOR PRO DASHBOARD <span class="live">● AO VIVO</span>
</header>

<div class="container">

<div class="card">
<input type="number" step="0.01" id="entrada" placeholder="Digite o multiplicador (ex: 1.45)">
<button onclick="add()">Adicionar</button>
</div>

<div class="card">
<p>📊 Média: <span id="media">0</span></p>
<p>🔥 Últimos: <span id="lista"></span></p>
<p id="alerta" class="alerta"></p>
</div>

<div class="card">
<canvas id="grafico"></canvas>
</div>

</div>

<script>
let dados = [];

const ctx = document.getElementById('grafico').getContext('2d');

const chart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: [],
        datasets: [{
            label: 'Multiplicadores',
            data: [],
            borderWidth: 2,
            tension: 0.3
        }]
    },
    options: {
        scales: {
            y: { beginAtZero: true }
        }
    }
});

function add(){
    let valor = parseFloat(document.getElementById('entrada').value);
    if(!valor) return;

    dados.push(valor);
    if(dados.length > 30) dados.shift();

    atualizar(valor);
}

function atualizar(valor){
    let soma = dados.reduce((a,b)=>a+b,0);
    let media = (soma / dados.length).toFixed(2);

    document.getElementById('media').innerText = media;
    document.getElementById('lista').innerText = dados.join(", ");

    chart.data.labels.push('');
    chart.data.datasets[0].data.push(valor);

    if(chart.data.labels.length > 30){
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
    }

    chart.update();

    analisar();
}

function analisar(){
    let ultimos = dados.slice(-5);
    let baixos = ultimos.filter(x => x < 1.5).length;

    if(baixos >= 4){
        document.getElementById('alerta').innerText = "⚠️ SEQUÊNCIA PERIGOSA (quedas baixas)";
    }
    else if(ultimos.filter(x => x > 2).length >= 3){
        document.getElementById('alerta').innerText = "🔥 POSSÍVEL MOMENTO DE ALTA";
    }
    else{
        document.getElementById('alerta').innerText = "✔️ Estável";
        document.getElementById('alerta').className = "safe";
    }
}
</script>

</body>
</html>
